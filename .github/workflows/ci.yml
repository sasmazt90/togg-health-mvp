name: CI / Submission QA Guard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Unit Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r services/core-api/requirements.txt

    - name: Run deterministic unit test suite
      run: |
        pytest tests/unit -v

  frontend-build:
    name: Frontend Production Build (Node.js 20)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      run: |
        npm ci

    - name: Run Next.js Production Build
      run: |
        cd apps/vehicle-app
        npm run build
